<!doctype html><html lang="fr"><head><title>Boyane AUTO</title><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap">
<style id="site-css">
/* Mise en page : vitrine noire, grille 2 colonnes de grandes photos, pastilles techniques posées sur l'image. */
:root{
  --bg:#08090e;--panel:#11131a;--pill:#191c26;--line:#282c38;--fg:#f6f6f4;--mut:#a0a0a6;
  --ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--wa:#25d366;--wa-ink:#06270f;--inv:#08090e;
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:22px;color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
h1{font-weight:400;letter-spacing:-.03em;text-wrap:balance}
.mut{color:var(--mut)}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px)}
.top .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:500;min-width:0}
.brand span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{width:30px;height:30px;border-radius:9px;flex:none;object-fit:cover;background:var(--pill);display:grid;place-items:center;font-size:12px;font-weight:600}
.logo-img{height:40px;width:auto;max-width:150px;object-fit:contain;display:block}
.login{max-width:400px;margin:0 auto;width:100%}
.login .err{color:var(--bad);font-size:14px}
.nav{display:flex;gap:30px;font-size:14px;color:var(--mut)}
.nav a:hover{color:var(--fg)}
.top-r{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.ico{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--fg)}
.ico:hover{background:var(--pill)}
.ico svg{width:17px;height:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 20px;border-radius:999px;font-weight:500;font-size:14px;white-space:nowrap;background:var(--pill);border:1px solid var(--line)}
.btn:hover{border-color:var(--mut)}
.btn.white{background:var(--fg);color:var(--inv);border-color:var(--fg)}
.btn.wa{background:var(--wa);color:var(--wa-ink);border-color:var(--wa);font-weight:600}
.btn.block{width:100%;min-height:52px;font-size:15px}
.btn.small{min-height:34px;padding:0 13px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:wait}
.btn svg{width:18px;height:18px;flex:none}
.admin-link{font-size:13px;color:var(--mut);padding:0 8px}

/* Accueil */
.hero{text-align:center;padding-block:64px 32px;display:grid;gap:12px;justify-items:center}
.hero h1{font-size:clamp(46px,8vw,76px);line-height:1}
.hero p{max-width:50ch;color:var(--mut)}
.hero .lead{color:var(--fg);font-size:clamp(17px,2.4vw,21px);line-height:1.35;text-wrap:balance}
.trust{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.trust li{background:var(--pill);border-radius:999px;padding:7px 14px;font-size:13.5px}
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--panel);border-radius:999px;max-width:100%;margin-top:14px}
.tabs button{padding:9px 16px;border-radius:999px;font-size:14px;color:var(--mut);white-space:nowrap}
.tabs button[aria-pressed=true]{background:var(--fg);color:var(--inv);font-weight:500}
.filters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px}
.pill-select{position:relative;display:inline-block}
.pill-select select{appearance:none;-webkit-appearance:none;background:var(--pill);border:0;border-radius:999px;padding:9px 32px 9px 16px;font-size:14px;cursor:pointer;max-width:170px}
.pill-select svg{position:absolute;right:13px;top:50%;width:11px;height:11px;transform:translateY(-50%);pointer-events:none;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 18px;padding-block:32px 72px}
.card{display:grid;gap:14px;min-width:0}
.card .ph{transition:transform .5s ease}
.card:hover .ph{transform:scale(1.025)}
.media{position:relative;aspect-ratio:3/2;max-width:100%;overflow:hidden;border-radius:var(--r);background:var(--panel)}
.ph{width:100%;height:100%;object-fit:cover;display:block}
.noimg{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;color:#5d5d64;font-size:13px;background:radial-gradient(90% 90% at 50% 100%,#1c2233,var(--panel))}
.noimg svg{width:min(62%,300px);height:auto}
.chips{position:absolute;left:14px;top:14px;right:14px;display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(10,10,11,.86);color:#f6f6f4;border-radius:999px;padding:5px 11px;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.card-b{display:flex;justify-content:space-between;gap:12px;padding-inline:6px;align-items:flex-start}
.card-b>div{min-width:0}
.card h2{font-size:17px;font-weight:500}
.more{display:inline-flex;align-items:center;gap:7px;color:var(--mut);font-size:14px;white-space:nowrap;padding-top:2px}
.more svg{width:12px;height:12px}
.card:hover .more{color:var(--fg)}
.tag{display:inline-block;font-size:11.5px;letter-spacing:.03em;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:2px;font-weight:400}
.empty{grid-column:1/-1;text-align:center;padding-block:56px;color:var(--mut)}
.how{border-top:1px solid var(--line);padding-block:48px}
.how ol{list-style:none;margin:24px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;counter-reset:s}
.how li{counter-increment:s;display:grid;gap:4px}
.how li::before{content:counter(s);width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:var(--pill);font-size:13px;margin-bottom:6px}
.how h2{font-size:24px;font-weight:400;letter-spacing:-.02em}
.how h3{font-size:15px;font-weight:500}
.foot{border-top:1px solid var(--line);padding-block:28px 40px;color:var(--mut);font-size:14px}
.foot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px}
.foot-b{display:flex;align-items:center;gap:14px}
.foot-b>div{display:grid}
.foot-b b{color:var(--fg);font-weight:500;font-size:15px}
.foot-wa{display:inline-flex;align-items:center;gap:9px;color:var(--fg);font-size:15px}
.foot-wa svg{width:20px;height:20px;color:var(--wa);flex:none}
.num{user-select:all;font-variant-numeric:tabular-nums}

/* Annonce */
.back{display:inline-flex;gap:8px;align-items:center;color:var(--mut);font-size:14px;padding-block:18px}
.back svg{width:12px;height:12px;transform:rotate(180deg)}
.detail{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:0 32px;align-items:start;padding-bottom:72px}
.gal,.info{grid-column:1;min-width:0}
.side{grid-column:2;grid-row:1/span 2}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:var(--r);scrollbar-width:none;background:var(--panel)}
.slides::-webkit-scrollbar{display:none}
.slides .media{flex:0 0 100%;scroll-snap-align:start;border-radius:0}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-block:10px}
.thumbs button{flex:0 0 84px;aspect-ratio:3/2;border-radius:10px;overflow:hidden;padding:0;opacity:.6;border:1px solid transparent}
.thumbs button:hover,.thumbs button.on{opacity:1;border-color:var(--fg)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.side{position:sticky;top:84px;display:grid;gap:16px;min-width:0}
.side h1{font-size:clamp(28px,4vw,38px);line-height:1.1}
.price{font-size:27px;font-weight:500;font-variant-numeric:tabular-nums}
.avail{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:var(--panel)}
.avail i{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--c)}
.avail b{display:block;font-weight:500;color:var(--c)}
.avail.dispo{--c:var(--ok)}.avail.reserve{--c:var(--warn)}.avail.vendu{--c:var(--bad)}
.section{display:grid;gap:14px;padding-top:30px}
.section h2{font-size:21px;font-weight:400;letter-spacing:-.015em}
.desc{display:grid;gap:12px;max-width:68ch;color:#d4d4d6}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px;margin:0}
.specs div{display:flex;justify-content:space-between;gap:16px;padding-block:10px;border-bottom:1px solid var(--line);font-size:14px}
.specs dt{color:var(--mut)}
.specs dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.opts{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.opts li{background:var(--pill);padding:6px 12px;border-radius:999px;font-size:13.5px}
.bar{display:none}

/* Administration */
.adm{padding-block:30px 80px;display:grid;gap:30px}
.adm h1{font-size:38px}
.adm-h{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.box{background:var(--panel);border-radius:var(--r);padding:clamp(16px,3vw,26px);display:grid;gap:18px;min-width:0}
.box h2{font-size:19px;font-weight:500}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.f{display:grid;gap:5px;min-width:0;font-size:13px;color:var(--mut)}
.f.w2{grid-column:span 2}.f.w3{grid-column:1/-1}
.f input,.f select,.f textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--fg)}
.f textarea{min-height:190px;resize:vertical;line-height:1.55}
.f small{color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.sp{justify-content:space-between}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pic{position:relative;aspect-ratio:3/2;border-radius:12px;overflow:hidden;background:var(--bg)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic .acts{position:absolute;inset:auto 5px 5px;display:flex;justify-content:space-between}
.pic .acts button{background:rgba(10,10,11,.86);color:#f6f6f4;border-radius:999px;font-size:12px;padding:3px 9px}
.pic em{position:absolute;left:6px;top:6px;font-style:normal;font-size:11px;background:#f6f6f4;color:#0a0a0b;border-radius:999px;padding:1px 8px}
.add-pic{aspect-ratio:3/2;border:1px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--mut);font-size:13px;cursor:pointer;text-align:center;padding:8px}
.add-pic:hover{border-color:var(--mut);color:var(--fg)}
.vh{position:absolute;width:1px;height:1px;opacity:0}
.list{display:grid;gap:8px}
.li{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:14px;align-items:center;padding:8px;border-radius:14px;background:var(--bg)}
.li .media{border-radius:9px}
.li .noimg svg,.li .noimg span{display:none}
.li h3{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.li p{font-size:13px;color:var(--mut)}
.li .row{justify-content:flex-end}
.li select{background:var(--pill);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--inv);padding:10px 18px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}

@media (max-width:860px){
  .nav{display:none}
  .top .wrap{grid-template-columns:minmax(0,1fr) auto}
  .hero{padding-block:36px 20px}
  .detail{grid-template-columns:minmax(0,1fr);gap:18px}
  .gal,.info,.side{grid-column:1;grid-row:auto}
  .side{position:static}
  .side .cta{display:none}
  .bar{display:flex;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--bg);border-top:1px solid var(--line);
    padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .with-bar{padding-bottom:96px}
  .how ol{grid-template-columns:minmax(0,1fr)}
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .f.w2{grid-column:1/-1}
  .li{grid-template-columns:72px minmax(0,1fr)}
  .li .row{grid-column:1/-1;justify-content:flex-start}
}
@media (max-width:620px){
  .grid{grid-template-columns:minmax(0,1fr);gap:26px}
  .specs{grid-template-columns:minmax(0,1fr)}
  .top .cta-top{display:none}
  .tabs button{padding:9px 12px;font-size:13.5px}
  .chips{left:10px;top:10px;right:10px}
}
@media (prefers-reduced-motion:reduce){.card .ph{transition:none}.card:hover .ph{transform:none}}
</style>

/* Les données sont écrites dans le dépôt GitHub, GitHub Pages republie ensuite le site. */
const b64=bytes=>{let o='';for(let i=0;i<bytes.length;i+=32768)o+=String.fromCharCode.apply(null,bytes.subarray(i,i+32768));return btoa(o)};
const hdr=t=>({authorization:'Bearer '+t,accept:'application/vnd.github+json'});
async function put(path,bytes,msg,tk,repo){
 const url='https://api.github.com/repos/'+repo+'/contents/'+path;
 for(let i=0;i<2;i++){
  const g=await fetch(url+'?t='+Date.now(),{headers:hdr(tk)});
  if(g.status===401)throw {code:401};
  const sha=g.ok?(await g.json()).sha:undefined;
  const r=await fetch(url,{method:'PUT',headers:hdr(tk),body:JSON.stringify({message:msg,content:b64(bytes),sha})});
  if(r.ok)return;
  if(r.status===401||r.status===403||r.status===404)throw {code:r.status};
 }
 throw {code:0};
}
const putJson=(path,obj,msg,tk,repo)=>put(path,new TextEncoder().encode(JSON.stringify(obj,(k,v)=>k==='preview'?undefined:v,1)),msg,tk,repo);
function expired(){ss.del('admin-connecte');token=null;isAdmin=false;toast('Accès GitHub refusé. Vérifiez votre jeton, il a peut-être expiré.',6000);route()}
async function save(msg){
 busy=true;

  await putJson('data/site.json',{settings:SITE.settings,cars:SITE.cars},msg,token,cfg.repo);
  busy=false;draft=null;route();toast(msg+'. En ligne pour tous dans 1 à 2 minutes.',6000);return true;
 }catch(e){busy=false;if(e&&e.code===401){expired();return false}toast('L\'enregistrement a échoué. Vérifiez votre connexion et réessayez.',5000);return false}
}

 const a=[title(c)+(c.trim?' '+c.trim:'')+', mise en circulation en '+(c.firstReg?c.firstReg.split('-').reverse().join('/'):c.year)+', avec '+nb(c.km)+' km au compteur.'];
 const b=[];if(c.fuel)b.push('motorisation '+c.fuel.toLowerCase());if(c.power)b.push(c.power+' ch');if(c.gearbox)b.push('boîte '+c.gearbox.toLowerCase());if(b.length)a.push('Elle propose : '+b.join(', ')+'.');
 if(c.color||c.body)a.push([c.body,c.color?'couleur '+c.color.toLowerCase():''].filter(Boolean).join(', ')+'.');
 const o=[];if(c.options&&c.options.length)o.push('Équipements : '+c.options.join(', ')+'.');if(c.warranty)o.push('Garantie : '+c.warranty+'.');o.push('Contactez-nous sur WhatsApp pour plus d\'informations ou pour organiser un essai.');
 return a.join(' ')+'\n\n'+o.join(' ');
}

async function shrink(file,max){
 try{const b=await createImageBitmap(file),k=Math.min(1,max/Math.max(b.width,b.height)),cv=document.createElement('canvas');cv.width=Math.round(b.width*k);cv.height=Math.round(b.height*k);cv.getContext('2d').drawImage(b,0,0,cv.width,cv.height);
  return await new Promise(r=>cv.toBlob(x=>r(x||file),'image/jpeg',.84))}catch(e){return file}
}
async function addImage(file){
 const b=await shrink(file,1600),bytes=new Uint8Array(await b.arrayBuffer());
 const ext=b.type==='image/png'?'png':'jpg',path='photos/'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+'.'+ext;
 try{await put(path,bytes,'Ajout photo',token,cfg.repo)}catch(e){if(e&&e.code===401)expired();throw e}
 const preview=await new Promise((ok,no)=>{const fr=new FileReader;fr.onload=()=>ok(fr.result);fr.onerror=no;fr.readAsDataURL(b)});
 return {src:path,preview};
}

const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
async function keyFrom(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:600000},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(tk,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await keyFrom(pw,salt),new TextEncoder().encode(tk));return {salt:hex(salt),iv:hex(iv),ct:hex(ct)}}
async function unseal(pw){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unhex(cfg.iv)},await keyFrom(pw,unhex(cfg.salt)),unhex(cfg.ct));return new TextDecoder().decode(pt)}
function loginView(){
 if(cfg){app.innerHTML=header()+'<main class="wrap adm"><form class="box login" id="login-form"><h1 style="font-size:30px">Connexion</h1><label class="f">Identifiant<input id="l-user" autocomplete="username" required></label><label class="f">Mot de passe<input id="l-pass" type="password" autocomplete="current-password" required></label><p class="err" id="l-err" role="alert" hidden></p><button class="btn white block" id="l-go" type="submit">Se connecter</button></form></main>'+footer();return}
 app.innerHTML=header()+'<main class="wrap adm"><form class="box login" id="setup-form"><h1 style="font-size:30px">Première configuration</h1><p class="mut">À faire une seule fois.</p><label class="f">Dépôt GitHub (nom-du-compte/nom-du-depot)<input id="g-repo" required></label><label class="f">Jeton GitHub<input id="g-token" type="password" autocomplete="off" required></label><label class="f">Choisissez un identifiant<input id="g-user" autocomplete="username" required></label><label class="f">Choisissez un mot de passe (14 caractères minimum)<input id="g-pass" type="password" autocomplete="new-password" required></label><p class="err" id="l-err" role="alert" hidden></p><button class="btn white block" id="l-go" type="submit">Enregistrer</button></form></main>'+footer();
}
function setSession(tk){token=tk;adminUser=cfg.user;ss.set('admin-connecte',tk);isAdmin=true;route()}
async function setup(){
 const v=i=>document.getElementById(i).value.trim(),err=document.getElementById('l-err'),go=document.getElementById('l-go');
 const fail=m=>{err.textContent=m;err.hidden=false;go.disabled=false;go.textContent='Enregistrer'};
 const repo=v('g-repo').replace(/^https:\/\/github\.com\//,'').replace(/\/$/,''),tk=v('g-token'),pw=document.getElementById('g-pass').value;
 if(pw.length<14)return fail('Le mot de passe doit faire au moins 14 caractères.');
 go.disabled=true;go.textContent='Vérification…';
 try{const c={user:v('g-user'),repo,...await seal(tk,pw)};await putJson('data/config.json',c,'Configuration admin',tk,repo);cfg=c;setSession(tk)}
 catch(e){fail('GitHub refuse l\'accès. Vérifiez le nom du dépôt et le jeton (droit Contents en lecture et écriture).')}
}
async function login(){
 const err=document.getElementById('l-err'),go=document.getElementById('l-go');
 const fail=m=>{err.textContent=m;err.hidden=false;go.disabled=false;go.textContent='Se connecter'};
 go.disabled=true;go.textContent='Vérification…';err.hidden=true;
 if(document.getElementById('l-user').value.trim()!==cfg.user)return fail('Identifiant ou mot de passe incorrect.');
 try{setSession(await unseal(document.getElementById('l-pass').value))}catch(e){fail('Identifiant ou mot de passe incorrect.')}
}

/* ---------- Routage ---------- */
function route(){
 const h=cur;
 if(h==='admin'){if(!isAdmin){loginView();return}adminView();return}
 if(h.startsWith('annonce-')){const c=SITE.cars.find(x=>x.id===h.slice(8));if(c){detail(c);scrollTo(0,0);return}}
 home();
}
/* Navigation pilotée par le script : elle marche aussi dans un aperçu où les liens # sont bloqués. */
function go(name){
 if(name===cur&&name!=='voitures'){return}
 if(!cur||cur==='voitures')scrollHome=scrollY;
 cur=name;
 try{history.pushState(null,'','#'+name)}catch(e){}
 route();
 scrollTo(0,name==='voitures'?scrollHome:0);
}
function fromUrl(){const h=location.hash.slice(1);if(h===cur)return;cur=h;route();scrollTo(0,h&&h!=='voitures'?0:scrollHome)}
addEventListener('hashchange',fromUrl);
addEventListener('popstate',fromUrl);

document.addEventListener('error',e=>{const t=e.target;if(t.tagName==='IMG'&&t.classList.contains('ph')){t.outerHTML=noimg()}},true);
document.addEventListener('click',async e=>{
 const link=e.target.closest('a[href^="#"]');
 if(link){e.preventDefault();const act=link.dataset.act;
  if(act==='cat'){S.cat=link.dataset.v;if(cur&&cur!=='voitures'){go('voitures')}else{home()}return}
  go(link.getAttribute('href').slice(1));return}
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='cat'){S.cat=b.dataset.v;home();return}
 if(a==='slide'){const s=document.getElementById('slides');s.scrollTo({left:s.clientWidth*+b.dataset.i,behavior:'smooth'});document.querySelectorAll('.thumbs button').forEach((x,i)=>x.classList.toggle('on',i===+b.dataset.i));return}
 if(!isAdmin)return;
 if(a==='logout'){ss.del('admin-connecte');token=null;isAdmin=false;draft=null;go('voitures');return}
 if(a==='new'){draft=emptyCar();adminView();scrollTo(0,0)}
 if(a==='closeform'){draft=null;adminView()}
 if(a==='edit'){const c=SITE.cars.find(x=>x.id===b.dataset.id);draft=JSON.parse(JSON.stringify(c));adminView();scrollTo(0,0)}
 if(a==='cover'){readForm();const[p]=draft.photos.splice(+b.dataset.i,1);draft.photos.unshift(p);document.getElementById('pics').innerHTML=picsHTML()}
 if(a==='rmpic'){readForm();draft.photos.splice(+b.dataset.i,1);document.getElementById('pics').innerHTML=picsHTML()}
 if(a==='gen'){readForm();if(!draft.brand||!draft.model){toast('Indiquez au moins la marque et le modèle.');return}const ta=document.getElementById('c-desc');b.disabled=true;b.textContent='Rédaction…';draft.desc=await generate(draft);ta.value=draft.desc;b.disabled=false;b.textContent='Générer à nouveau'}
 if(a==='del'){const id=b.dataset.id;if(armed!==id){armed=id;adminView();return}armed=null;SITE.cars=SITE.cars.filter(c=>c.id!==id);await save('Annonce supprimée');}
 if(a==='rmdemo'){if(armed!=='demo'){armed='demo';b.textContent='Confirmer la suppression';return}armed=null;SITE.cars=SITE.cars.filter(c=>!c.demo);await save('Exemples supprimés')}
});
document.addEventListener('change',async e=>{
 const t=e.target;
 if(t.dataset.filter){S[t.dataset.filter]=t.value;document.getElementById('grid').innerHTML=gridHTML();return}
 if(!isAdmin)return;
 if(t.dataset.status){const c=SITE.cars.find(x=>x.id===t.dataset.status);c.status=t.value;await save('Disponibilité mise à jour');return}
 if(t.dataset.f==='firstReg'||t.dataset.f==='year'){readForm();if(t.dataset.f==='firstReg'&&t.value){const y=t.value.slice(0,4);draft.year=y;document.getElementById('c-year').value=y}const a=ageHint();if(a!=null&&a<5){draft.cat=a<3?'3':'5';document.getElementById('c-cat').value=draft.cat}hint()}
 if(t.id==='pic-input'){const fs=[...t.files];readForm();toast('Envoi de '+fs.length+' photo(s)…',60000);let bad=0;for(const f of fs){try{draft.photos.push(await addImage(f))}catch(err){bad++}}document.getElementById('pics').innerHTML=picsHTML();toast(bad?bad+' photo(s) refusée(s). Utilisez du JPEG ou du PNG.':'Photos ajoutées. Publiez l\'annonce pour les garder.',4000)}
 if(t.id==='logo-input'&&t.files[0]){try{SITE.settings.logo=await addImage(t.files[0]);document.getElementById('logo-state').textContent='Logo prêt. Cliquez sur Enregistrer.'}catch(err){toast('Logo refusé. Utilisez du JPEG ou du PNG.')}}
});
document.addEventListener('submit',async e=>{
 e.preventDefault();
 if(e.target.id==='login-form'){login();return}
 if(e.target.id==='setup-form'){setup();return}
 if(!isAdmin||busy)return;
 if(e.target.id==='set-form'){const g=i=>document.getElementById(i).value.trim();const np=document.getElementById('s-pass').value;
  if(np&&np.length<14){toast('Le mot de passe doit faire au moins 14 caractères.',4000);return}
  const nu=g('s-user')||adminUser;
  if(np||nu!==adminUser){try{const c={...cfg,user:nu,...(np?await seal(token,np):{})};await putJson('data/config.json',c,'Identifiants admin',token,cfg.repo);cfg=c;adminUser=nu}catch(err){toast('Identifiants non modifiés. Réessayez.',4000);return}}
  SITE.settings.name=g('s-name')||SITE.settings.name;SITE.settings.tagline=g('s-tagline');SITE.settings.whatsapp=g('s-wa').replace(/\D/g,'')||SITE.settings.whatsapp;SITE.settings.facebook=g('s-fb');await save('Informations enregistrées');return}
 if(e.target.id!=='car-form')return;
 readForm();const need=[['brand','la marque'],['model','le modèle'],['year','l\'année'],['km','le kilométrage'],['price','le prix']].filter(([k])=>draft[k]===''||draft[k]==null);
 if(need.length){toast('Indiquez '+need.map(n=>n[1]).join(', ')+'.',4000);return}
 const btn=document.getElementById('save');btn.disabled=true;
 ['year','km','price','power','doors','seats','owners'].forEach(k=>{if(draft[k]!=='')draft[k]=+draft[k]});
 if(!draft.desc.trim()){btn.textContent='Rédaction du descriptif…';const ta=document.getElementById('c-desc');draft.desc=await generate(draft);ta.value=draft.desc}
 btn.textContent='Publication…';
 const isNew=!draft.id;if(isNew){draft.id='a'+Date.now().toString(36);SITE.cars.unshift(draft)}else{const i=SITE.cars.findIndex(c=>c.id===draft.id);if(i>=0)SITE.cars[i]=draft}
 const ok=await save(isNew?'Annonce publiée':'Annonce mise à jour');
 if(!ok){btn.disabled=false;btn.textContent='Publier l\'annonce'}
});

/* ---------- Démarrage ---------- */
route();
(async()=>{
 try{const r=await fetch('data/config.json?t='+Date.now(),{cache:'no-store'});if(r.ok)cfg=await r.json()}catch(e){}
 token=cfg?ss.get('admin-connecte'):null;if(cfg)adminUser=cfg.user;isAdmin=!!token;
 try{const r=await fetch('data/site.json?t='+Date.now(),{cache:'no-store'});if(r.ok){const j=await r.json();SITE.settings=j.settings;SITE.cars=j.cars}}catch(e){}
 loading=false;route();
})();
})();
</script>
